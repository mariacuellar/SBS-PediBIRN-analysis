<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a7a"/>
    </marker>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 40px; font-weight: 700; fill: #111; text-anchor: middle; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 24px; fill: #333; text-anchor: middle; }
      .box { fill: #f3f3f3; stroke: #b8b8b8; stroke-width: 3; rx: 10; ry: 10; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 28px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #7a7a7a; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .edge-bold { stroke: #7a7a7a; stroke-width: 4.5; fill: none; marker-end: url(#arrow); }
      .effect { font-family: Helvetica, Arial, sans-serif; font-size: 24px; fill: #222; }
      .note { font-family: Helvetica, Arial, sans-serif; font-size: 22px; fill: #444; text-anchor: middle; }
    </style>
  </defs>

  <text x="900" y="70" class="title">Figure 1. Model A Mediation Replication</text>
  <text x="900" y="115" class="subtitle">Boos 2025 structure recreated with PediBIRN subset estimates</text>
  <text x="900" y="155" class="subtitle">Total effect β = 3.872 | n = 313 complete cases</text>

  <rect class="box" x="100" y="420" width="360" height="170"/>
  <text class="label" x="280" y="485">Isolated inertial</text>
  <text class="label" x="280" y="530">injury</text>

  <rect class="box" x="690" y="220" width="360" height="150"/>
  <text class="label" x="870" y="295">Diffuse HIE</text>

  <rect class="box" x="690" y="640" width="360" height="150"/>
  <text class="label" x="870" y="705">Extra-axial blood</text>

  <rect class="box" x="1280" y="420" width="360" height="170"/>
  <text class="label" x="1460" y="485">Severe retinal</text>
  <text class="label" x="1460" y="530">injury</text>

  <path class="edge" d="M 460 470 C 560 400, 600 350, 690 300"/>
  <path class="edge" d="M 460 540 C 560 610, 600 660, 690 710"/>
  <path class="edge" d="M 1050 300 C 1150 330, 1180 390, 1280 470"/>
  <path class="edge" d="M 1050 710 C 1150 680, 1180 620, 1280 540"/>
  <path class="edge-bold" d="M 460 505 C 760 505, 980 505, 1280 505"/>

  <text x="520" y="365" class="effect">Indirect via diffuse HIE β = 0.467</text>
  <text x="500" y="825" class="effect">Indirect via extra-axial blood β = 1.914</text>
  <text x="840" y="470" class="effect">Direct effect β = 1.490</text>

  <text x="900" y="990" class="note">Effects shown are subset-based replication estimates on the log-odds scale.</text>
  <text x="900" y="1030" class="note">Model A inferred from Boos et al. (2025): exposure = isolated inertial injury; mediators = diffuse HIE and extra-axial blood.</text>
</svg>
