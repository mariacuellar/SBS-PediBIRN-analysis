<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #111; text-anchor: middle; }
      .subtitle { font-family: Helvetica, Arial, sans-serif; font-size: 22px; fill: #444; text-anchor: middle; }
      .box { fill: #f6f6f6; stroke: #bdbdbd; stroke-width: 3; rx: 12; ry: 12; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 24px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #6c6c6c; stroke-width: 4; fill: none; }
      .mark { font-family: Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #555; text-anchor: middle; dominant-baseline: middle; }
      .note { font-family: Helvetica, Arial, sans-serif; font-size: 20px; fill: #444; text-anchor: middle; }
    </style>
  </defs>

  <text x="900" y="60" class="title">Figure 7. FCI Graph on the 8-Variable Union</text>
  <text x="900" y="100" class="subtitle">Estimated PAG from the combined variable set used across Models A-E</text>

  <rect class="box" x="90" y="170" width="330" height="130"/>
  <text class="label" x="255" y="225">Isolated inertial</text>
  <text class="label" x="255" y="265">injury</text>

  <rect class="box" x="520" y="170" width="300" height="130"/>
  <text class="label" x="670" y="245">Inertial injury</text>

  <rect class="box" x="950" y="170" width="300" height="130"/>
  <text class="label" x="1100" y="245">Diffuse HIE</text>

  <rect class="box" x="1360" y="170" width="350" height="130"/>
  <text class="label" x="1535" y="225">Severe retinal</text>
  <text class="label" x="1535" y="265">injury</text>

  <rect class="box" x="120" y="560" width="340" height="130"/>
  <text class="label" x="290" y="625">Clinical hypoxia</text>
  <text class="label" x="290" y="665">or ischemia</text>

  <rect class="box" x="520" y="560" width="360" height="130"/>
  <text class="label" x="700" y="605">Duration of altered</text>
  <text class="label" x="700" y="645">consciousness</text>

  <rect class="box" x="960" y="560" width="320" height="130"/>
  <text class="label" x="1120" y="625">Extra-axial blood</text>

  <rect class="box" x="1380" y="560" width="250" height="130"/>
  <text class="label" x="1505" y="625">Seizure</text>

  <path class="edge" d="M 420 235 C 455 235, 485 235, 520 235"/>
  <text class="mark" x="452" y="215">o</text>
  <text class="mark" x="488" y="215">o</text>

  <path class="edge" d="M 1250 235 C 1290 235, 1320 235, 1360 235"/>
  <text class="mark" x="1288" y="215">o</text>
  <text class="mark" x="1322" y="215">o</text>

  <text x="900" y="860" class="note">Only two adjacencies were retained by FCI on the 8-variable union: isolated inertial injury o-o inertial injury</text>
  <text x="900" y="892" class="note">and diffuse HIE o-o severe retinal injury. All other variables were left disconnected in the estimated PAG.</text>
</svg>
